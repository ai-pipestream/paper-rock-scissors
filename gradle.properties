# Gradle properties

quarkusPluginId=io.quarkus
# Keep the Gradle plugin version aligned with the platform BOM below. A mismatch
# (plugin 3.31.2 vs platform 3.37.1) breaks augmentation with
# NoSuchMethodException: AugmentActionImpl.<init>(CuratedApplication, List).
quarkusPluginVersion=3.37.1
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.38.0
