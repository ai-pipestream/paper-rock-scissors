# Generate gRPC stubs from the proto contracts packaged in the :common module.
quarkus.generate-code.grpc.scan-for-proto=ai.pipestream:common

# gRPC Configuration
quarkus.grpc.server.port=9000
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.enable-reflection-service=true
quarkus.grpc.server.use-separate-server=false

# Database Configuration
# db-kind=postgresql triggers Dev Services to start a PostgreSQL container and
# wire up BOTH datasources: the reactive one (Hibernate Reactive runs queries) and
# the JDBC one (Hibernate ORM runs the schema DDL — see %prod below).
quarkus.datasource.db-kind=postgresql

# Hibernate Configuration
# Using the modern schema-management property from reference standards.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# Logging
quarkus.log.level=INFO
quarkus.log.category."ai.pipestream.arena".level=INFO
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n

# HTTP Port (used for health checks and unified gRPC)
quarkus.http.port=8080

# HTTP/2 flow-control window.
# gRPC runs on the unified Vert.x HTTP server (use-separate-server=false), so the
# window is a plain HTTP/2 setting, NOT a quarkus.grpc.* one. Vert.x defaults the
# per-stream SETTINGS_INITIAL_WINDOW_SIZE to 64 KB (65535) — 16x smaller than the
# grpc-java/Netty default of 1 MB, which throttled streaming throughput. Raise both
# the per-stream and the connection window to 1 MB to match vanilla grpc-java (see
# :netty-server) and give the streaming arena room to keep the pipe full.
quarkus.http.initial-window-size=1048576
quarkus.http.http2-connection-window-size=1048576

# Production Profiles
# Both URLs are required: reactive for the query path, JDBC for Hibernate ORM's
# schema DDL. (In dev, Dev Services sets both automatically.)
%prod.quarkus.datasource.reactive.url=postgresql://localhost:5432/arena
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/arena
%prod.quarkus.datasource.username=quarkus
%prod.quarkus.datasource.password=quarkus