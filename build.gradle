// Root build for the Paper-Rock-Scissors Arena.
//
// This is a multi-module project so the same arena can be shown two ways:
//   :mutiny-server — reactive (Mutiny + Hibernate Reactive)
//   :vt-server     — virtual threads (@RunOnVirtualThread + blocking Hibernate ORM)
//   :common        — protos + pure game logic shared by both
//
// Java 21 is required across the board: virtual threads (Project Loom) are only
// available on 21+. Mutiny runs happily on 21, so both variants share the toolchain.

allprojects {
    group = 'ai.pipestream'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
        mavenLocal()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // -parameters keeps parameter names for gRPC/Quarkus reflection.
        options.compilerArgs << '-parameters'
    }
}
