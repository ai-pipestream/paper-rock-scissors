pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
    plugins {
        id "${quarkusPluginId}" version "${quarkusPluginVersion}"
    }
}
rootProject.name='paper-rock-scissors-arena'

// Two implementations of the same arena, side by side:
//   :mutiny-server — reactive (Mutiny + Hibernate Reactive), the original design
//   :vt-server     — virtual threads (@RunOnVirtualThread + blocking Hibernate ORM)
// Both share protos and pure game logic from :common. See docs/lessons/06-*.
include 'common'
include 'mutiny-server'
include 'vt-server'
// :netty-server — a plain grpc-java / Netty server (no Quarkus at all), the
// control group for the performance comparison. Same contracts, vanilla stubs.
include 'netty-server'
